[tool.poetry]
name = "smart-saver-bot"
version = "0.1.0-dev"
description = "Smart Saver Bot — an economic shopping optimization bot for the Bale messenger, built on OKALA store data."
authors = ["Smart Saver Bot Team"]
license = "TODO"
readme = "README.md"
package-mode = true
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Phase 2 ("Backend Core") introduces the FastAPI application, async
# PostgreSQL access via SQLAlchemy, and async Redis access — see
# docs/architecture-decisions.md, ADR-006 onward. python-bale-bot is
# still deferred to the Phase 5 bot layer; it has no role in the
# infrastructure this phase builds.
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.54"}
asyncpg = "^0.31.0"
redis = "^8.1.0"
alembic = "^1.20.0"
# Phase 3 ("OKALA Data Provider"): async HTTP client for the provider
# adapter (app/scrapers). Chosen for consistency with the project's
# async architecture — see docs/okala-research.md.
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.6.2"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.3"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff: linting + import sorting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Formatting is Black's responsibility; Ruff's formatter stays off to
# avoid two tools fighting over the same job.
docstring-code-format = false

# ---------------------------------------------------------------------------
# Black: code formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# MyPy: static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real PostgreSQL and/or Redis instance (see tests/integration).",
]
