# Local development / test infrastructure only — NOT a production
# deployment manifest (see docs/architecture-decisions.md, ADR-011).
# Brings up throwaway PostgreSQL and Redis instances matching the
# values in .env.example / tests/conftest.py.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ssb
      POSTGRES_PASSWORD: ********
      POSTGRES_DB: shopping_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
